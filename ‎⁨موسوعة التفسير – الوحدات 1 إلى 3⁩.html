<header><h1>📖 موسوعة التفسير</h1><p>الوحدات الأولى والثانية والثالثة – شرح وأسئلة وتدريبات</p></header>

<script>
const L=[
{u:"الوحدة الأولى: مقدمة في التفسير",t:"1 – التعريف بعلم التفسير ونشأته",s:[
["تمهيد","<p><b>التفسير لغة:</b> مصدر الفعل فسّر، ويدل على الكشف والبيان والإظهار.</p><p><b>اصطلاحًا:</b> بيان معاني القرآن الكريم (من أدق التعاريف).</p>"],
["المرحلة الأولى: الفهم والتلقي","<p>تعلّم التفسير فيها يتم عبر التلقي، ولها فترتان:</p><ul><li><b>عهد النبي ﷺ:</b> كان يبيّن للصحابة ما أشكل عليهم، قال تعالى ﴿وأنزلنا إليك الذكر لتبين للناس ما نزل إليهم﴾ [النحل:44]. مثاله: لما نزلت ﴿الذين آمنوا ولم يلبسوا إيمانهم بظلم﴾ [الأنعام:82] شقّ ذلك عليهم، فبيّن أن الظلم هنا الشرك، مستشهدًا بآية لقمان:13 (البخاري 3429).</li><li><b>عهد الصحابة:</b> منهجهم ألا يتجاوزوا عشر آيات حتى يتعلموا ما فيها من العلم والعمل. اشتهر منهم: الخلفاء الأربعة، وابن عباس، وابن مسعود، وأُبيّ بن كعب.</li></ul><p><b>تميّز تفسير الصحابة:</b> عدالتهم وسلامة مقصدهم – شهدوا نزول القرآن – أهل اللسان العربي – حسن فهمهم للنصوص الشرعية.</p>"],
["المرحلة الثانية: الكتابة والتدوين","<ul><li><b>الفترة الأولى (بداية الجمع):</b> بطريقتين: ① جمع التفسير مع الحديث (شعبة بن الحجاج، ووكيع بن الجراح، وسفيان بن عيينة) ② تدوينه في مؤلفات مستقلة بترتيب المصحف (تفسير مجاهد، وأبي صالح باذام).</li><li><b>الفترة الثانية (استقلال التفسير كعلم):</b> وُضع التفسير لكل آية مرتبًا على المصحف، على يد ابن جرير الطبري وابن أبي حاتم وغيرهما.</li></ul>"],
["مدرستا التأليف","<p><b>① التفسير بالمأثور:</b> أعلى طرق التفسير منزلة، مصادره الأربعة: القرآن بالقرآن، القرآن بالسنة، أقوال الصحابة، أقوال التابعين. ويشترط: دقة استنباط المعنى، وصحة الإسناد، وعدم مخالف من الصحابة، وإجماع التابعين. أبرز كتبه: جامع البيان للطبري، تفسير ابن كثير، أضواء البيان للشنقيطي.</p><p><b>② التفسير بالرأي:</b> الاجتهاد والاستنباط العقلي، بعد المأثور في المرتبة. <i>المحمود:</i> اجتهاد مبني على علم من القرآن والسنة ولغة العرب (جائز) مثل: محاسن التأويل للقاسمي، البحر المحيط لأبي حيان. <i>المذموم:</i> اجتهاد عن جهل أو هوى بلا قواعد الشريعة والعربية.</p>"]],
q:[["ما الدليل على أن النبي ﷺ كان يبين معاني القرآن؟","قوله تعالى ﴿لتبين للناس ما نزل إليهم﴾، ومثاله بيانه أن الظلم في آية الأنعام هو الشرك."],
["لم لم يكن الصحابة يستشكلون كلمات القرآن أو يكثرون السؤال عنها؟","لأنهم أهل اللسان العربي، وشهدوا نزول القرآن، وحسن فهمهم، والنبي ﷺ يبيّن لهم ما أشكل."],
["علام يدل منهج الصحابة: ألا يتجاوزوا عشر آيات حتى يتعلموا ما فيها؟","يدل على الجمع بين العلم والعمل، وأن الهدف من القرآن العمل به لا مجرد القراءة."],
["ما الفرق بين الفترة الأولى والثانية في مرحلة الكتابة والتدوين؟","الأولى: جمع التفسير مع الحديث أو في مؤلفات تفسّر بعض القرآن. الثانية: استقل التفسير علمًا قائمًا بذاته يفسّر كل آية بترتيب المصحف."],
["اتسعت حركة التأليف مع اتساع العالم الإسلامي، استنتج العلاقة.","علاقة طردية: كلما اتسعت رقعة الإسلام ودخل الناس فيه ازدادت الحاجة لتفسير القرآن وبيانه فكثر التأليف."],
["أصمم: خارطة مفاهيم لمراحل نشأة علم التفسير.","الفهم والتلقي ← (عهد النبي ﷺ، عهد الصحابة) | الكتابة والتدوين ← (بداية الجمع، استقلال التفسير) ← مدرستا المأثور والرأي."]]},
{u:"الوحدة الأولى: مقدمة في التفسير",t:"2 – أهمية علم التفسير وضوابطه",s:[
["تمهيد (فوائد حديث مسلم 2699)","<p>«وما اجتمع قوم في بيت من بيوت الله يتلون كتاب الله ويتدارسونه بينهم إلا نزلت عليهم السكينة وغشيتهم الرحمة وحفتهم الملائكة وذكرهم الله فيمن عنده». الفوائد: نزول السكينة – غشيان الرحمة – حفوف الملائكة – ذكر الله لهم.</p>"],
["أهمية علم التفسير","<ul><li>① يتعلق بكتاب الله الخالد ومعجزاته الدائمة ﴿إن هذا القرآن يهدي للتي هي أقوم﴾ [الإسراء:9].</li><li>② داخل في قوله ﷺ «خيركم من تعلم القرآن وعلّمه» (البخاري 5027).</li><li>③ المسلم مطالب بتدبر القرآن وتفهمه ﴿ليدبروا آياته وليتذكر أولو الألباب﴾ [ص:29].</li></ul>"],
["ضوابط التفسير","<p>مراعاتها واجبة حتى لا يكون التفسير قولًا على الله بغير علم (الأنعام:21).</p><ul><li><b>أولًا: سلامة العقيدة:</b> الموافقة لعقيدة سلف الأمة؛ وقد أخطأ بعض المفسرين المخالفين فحملوا الألفاظ على هواهم.</li><li><b>ثانيًا: الاعتماد على أصح الطرق:</b> ① القرآن بالقرآن (مثاله: «سجّيل» فُسّرت بالطين في الذاريات:33) ② القرآن بالسنة (مثاله: ﴿سيجعل لهم الرحمن ودًّا﴾ وحديث أبي هريرة في محبة جبريل، البخاري 6040) ③ أقوال الصحابة ④ أقوال التابعين.</li><li><b>ثالثًا: معرفة اللغة العربية ومعاني الألفاظ:</b> ومنها مراعاة سياق الآية، مثاله ﴿ذق إنك أنت العزيز الكريم﴾ [الدخان:49] سياقها يدل على التحقير والإذلال.</li></ul>"]],
q:[["قارن بين تفسير ﴿فويل للمصلين﴾ مقطوعة عن سياقها وضمن سياقها.","مقطوعة توهم أن الوعيد لكل مصلٍّ، وضمن السياق (﴿الذين هم عن صلاتهم ساهون﴾) الوعيد لمن يتهاون بالصلاة ويرائي."],
["﴿فلا تقل لهما أف ولا تنهرهما﴾: علام تدل وماذا تتضمن؟","تدل على تحريم أذى الوالدين بأي قول، وتتضمن النهي عن كل ما هو أشد من التأفف (الضرب والشتم) من باب أولى."],
["حدد معنى (نظر): ﴿إلى ربها ناظرة﴾ – ﴿أولم ينظروا في ملكوت السماوات﴾ – ﴿انظرونا نقتبس من نوركم﴾","1) النظر بالبصر. 2) الاعتبار والتفكر. 3) الانتظار."],
["أستنبط: استخرج الآية المبينة لقوله ﴿أحلت لكم بهيمة الأنعام إلا ما يتلى عليكم﴾ [المائدة:1].","الآية الثالثة من المائدة: ﴿حرمت عليكم الميتة والدم ولحم الخنزير…﴾."],
["اذكر ثلاث أهميات لعلم التفسير.","تعلقه بكتاب الله الخالد – دخوله في خيرية تعلم القرآن – تحقيق الأمر بتدبر القرآن."]]},
{u:"الوحدة الأولى: مقدمة في التفسير",t:"3 – أبرز المؤلفات الموثوقة في التفسير",s:[
["تمهيد","<p>الكتب المصنفة في التفسير ليست على درجة واحدة، فالواجب الاعتماد على التفاسير الموثوقة التي التزم مؤلفوها بضوابط التفسير.</p>"],
["① جامع البيان عن تأويل آي القرآن","<p>أهم كتب التفسير وأصحها، قال ابن تيمية إنه يذكر مقالات السلف بالأسانيد الثابتة وليس فيه بدعة.</p><table><tr><th>المؤلف</th><td>أبو جعفر محمد بن جرير الطبري</td></tr><tr><th>المولد/الوفاة</th><td>224هـ – 310هـ</td></tr><tr><th>حياته</th><td>عالم بالقراءات والتفسير، حافظ للحديث، شيخ للمؤرخين</td></tr><tr><th>أبرز مؤلفاته</th><td>التفسير، تاريخ الأمم والملوك، تهذيب الآثار</td></tr></table>"],
["② تفسير القرآن العظيم","<p>من أشهر ما دُوّن في التفسير بالمأثور وفي المرتبة الثانية بعد الطبري. منهجه: يذكر الآية ويفسرها بالآيات المناسبة، ثم الأحاديث، ثم أقوال الصحابة والتابعين والعلماء المعتبرين.</p><table><tr><th>المؤلف</th><td>أبو الفداء عماد الدين إسماعيل بن كثير الدمشقي</td></tr><tr><th>المولد/الوفاة</th><td>700هـ – 774هـ</td></tr><tr><th>حياته</th><td>رحل في طلب العلم، وصلته بشيخ الإسلام ابن تيمية</td></tr><tr><th>مؤلفاته</th><td>التفسير، البداية والنهاية، جامع المسانيد والسنن</td></tr></table>"],
["③ الدر المنثور في التفسير بالمأثور","<p>أجمع ما أُلّف في التفسير بالمأثور: دوّن فيه الآثار عن النبي ﷺ والصحابة والتابعين.</p><table><tr><th>المؤلف</th><td>جلال الدين عبد الرحمن بن أبي بكر السيوطي</td></tr><tr><th>المولد/الوفاة</th><td>849هـ – 911هـ</td></tr><tr><th>مؤلفاته</th><td>التفسير، الإتقان في علوم القرآن، لباب النقول في أسباب النزول</td></tr></table>"],
["④ تيسير الكريم الرحمن في تفسير كلام المنان","<p>تفسير مختصر عُني فيه بالمعنى الإجمالي وإبراز مقاصد القرآن وما يُستنبط من فوائد وأحكام.</p><table><tr><th>المؤلف</th><td>عبد الرحمن بن ناصر السعدي (القصيم 1307هـ – 1376هـ)</td></tr><tr><th>حياته</th><td>توفي والداه وهو صبي، حفظ القرآن في الرابعة عشرة، ثم تصدر للتعليم</td></tr><tr><th>مؤلفاته</th><td>التفسير، مقاصد التوحيد، القواعد الحسان لتفسير القرآن</td></tr></table>"],
["⑤ أضواء البيان في إيضاح القرآن بالقرآن","<p>من أفضل المؤلفات المعاصرة. <b>مميزاته:</b> تفسير القرآن بالقرآن – العناية بالأحكام الفقهية مع دقة الاستنباط وقوة الاستدلال. لم يفسر جميع الآيات، ووصل إلى سورة المجادلة ثم أتمه تلميذه عطية سالم.</p><table><tr><th>المؤلف</th><td>محمد الأمين بن محمد المختار الشنقيطي (موريتانيا 1325هـ – 1393هـ)</td></tr><tr><th>مؤلفاته</th><td>التفسير، دفع إيهام الاضطراب عن آيات الكتاب، الأسماء والصفات نقلًا وعقلًا</td></tr></table>"]],
q:[["بيّن منهج ابن كثير في تفسيره.","يفسر الآية بالآيات المناسبة، ثم يورد الأحاديث، ثم أقوال الصحابة والتابعين والعلماء المعتبرين، معتمدًا على أصح طرق التفسير."],
["بم تميز تفسير أضواء البيان؟","بتفسير القرآن بالقرآن، والعناية بالأحكام الفقهية مع دقة الاستنباط وقوة الاستدلال."],
["لو أردت الوصول إلى المعنى الإجمالي المختصر للآيات فأي تفسير ستطالع؟","تيسير الكريم الرحمن للسعدي؛ لأنه مختصر ويعتني ببيان المعنى الإجمالي."]]},
{u:"الوحدة الأولى: مقدمة في التفسير",t:"4 – التقنية في خدمة القرآن وتفسيره",s:[
["تمهيد","<p>من نعم الله في العصر الحديث التقدم العلمي والتقني الذي يسّر نقل المعلومات وحفظها والوصول إليها. وعلى الباحث أن يميّز المصادر الرقمية الموثوقة حتى لا يقع في فهم خاطئ لكلام الله.</p>"],
["المصادر الموثوقة","<ul><li><b>أولًا – مصحف مدرستي:</b> تطبيق إلكتروني للأجهزة اللوحية والذكية تشرف عليه وزارة التعليم. يستعرض السور المطلوبة في المقرر للحفظ والتلاوة، ومن خصائصه: اختيار القارئ، التكرار، الاطلاع على التفسير، حل الواجبات، حفظ التسجيل الصوتي وإرساله للمعلم. الدخول باسم المستخدم وكلمة المرور على منصة مدرستي.</li><li><b>ثانيًا – الإصدارات الرقمية لمجمع الملك فهد لطباعة المصحف الشريف:</b> قواعد بيانات المصحف، الإصدارات الرقمية، البرمجيات الحديثة، الخدمات المساندة (تلاوات، تفسير، علوم، ترجمة معاني). أنشأ ستة عشر موقعًا متخصصًا؛ ومنها نسخ رقمية من مصحف المدينة النبوية بعدة روايات، وفيها معلومات عن السورة: سبب التسمية، مكان النزول، الترتيب، عدد الآيات.</li><li><b>ثالثًا – تطبيق مصحف (آيات):</b> مشروع من جامعة الملك سعود، محاكاة إلكترونية للمصحف، بسبع عشرة لغة وترجمة معاني لأكثر من عشرين لغة، وترجمة صوتية للغتين، وسبعة تفاسير، وتلاوات لمشاهير القراء مع التكرار؛ يخدم الأطفال وذوي الإعاقة البصرية، ويتيح اختبار الحفظ بإخفاء الآيات.</li></ul>"]],
q:[["أقارن: بين تفسير الطبري وابن كثير في قوله ﴿وهو الذي جعل الليل والنهار خلفة﴾ [الفرقان:62].","تدريب عملي: افتح تطبيق (آيات)، وقارن؛ الطبري يفصّل الأقوال بالأسانيد، وابن كثير يختصر ويرجّح ويذكر الآيات والأحاديث المناسبة."],
["ألخّص: ما ذكره السعدي في تفسير ﴿وقال الرسول يا رب إن قومي اتخذوا هذا القرآن مهجورًا﴾ [الفرقان:30].","تدريب عملي بالتطبيق: يلخّص السعدي أن هجر القرآن يشمل ترك الإيمان به أو العمل به أو تدبره."],
["مشروع الوحدة: مقال مختصر عن إحدى مسابقات القرآن (الملك عبد العزيز الدولية / الملك سلمان المحلية / جائزة الأمير سلطان لذوي الإعاقة).","اشمل: ① المكان وتاريخ الانطلاق والمدة والإجراءات ② الفروع ③ شروط الاشتراك ④ الجوائز."]]},
{u:"الوحدة الثانية: سورة الفاتحة",t:"5 – تفسير سورة الفاتحة",s:[
["تمهيد","<p>سورة مكية، آياتها سبع، وأول سورة نزلت كاملة.</p>"],
["فضائل السورة","<ul><li>① نور لم يؤتَه نبي قبل محمد ﷺ (مسلم 806).</li><li>② رقية شافية (حديث أبي سعيد الخدري، البخاري 2276).</li><li>③ تحصل بقراءتها المناجاة بين العبد وربه في الصلاة (حديث «قسمت الصلاة بيني وبين عبدي نصفين»، مسلم 395).</li></ul>"],
["المعنى الإجمالي","<p>يخبر الله أنه المستحق للحمد الكامل، ذو الرحمة العامة في الدنيا والخاصة بالمؤمنين في الآخرة، وذو الملك التام يوم القيامة. ويرشد عباده لتوحيده وإفراده بالعبادة وطلب العون منه، وسؤاله الهداية للطريق الواضح، لا طريق المغضوب عليهم ولا الضالين.</p>"],
["معاني الكلمات","<table><tr><th>الكلمة</th><th>معناها</th></tr><tr><td>إياك نستعين</td><td>نطلب العون منك وحدك</td></tr><tr><td>الصراط المستقيم</td><td>الطريق الواضح الموصل إلى الله وجنته</td></tr><tr><td>المغضوب عليهم</td><td>الذين عرفوا الحق ولم يتبعوه</td></tr><tr><td>الضالين</td><td>الذين تركوا الحق بسبب جهلهم وتفريطهم في طلبه</td></tr></table>"],
["فوائد وأحكام","<ul><li>① «الرب»: السيد أو المربي أو المالك؛ فإن وردت مطلقة قُصد بها الخالق.</li><li>② الرحمن: الواسعة لجميع الخلق في الدنيا، والرحيم: ذو رحمة خاصة بالمؤمنين، ﴿وكان بالمؤمنين رحيمًا﴾ [الأحزاب:43].</li><li>③ آثار الإيمان بالأسماء والصفات: الخلق ← تعظيمه ومحبته والتفكر في خلقه؛ المعين ← الاستعانة به وحده والتوكل عليه؛ الهادي ← الاعتقاد أن الهداية نعمة منه وكثرة طلبها.</li><li>④ أسماء يوم القيامة: يوم الدين، ويوم الحساب، ويوم الفصل، ويوم الجمع، ويوم الحسرة…</li><li>⑤ العبادة تتضمن كمال الذل مع كمال الحب: بفعل الطاعات وترك المعاصي.</li><li>⑥ جمع بين العبادة والاستعانة لأنه لا قيام بالعبادة إلا بمعونة الله.</li></ul><p><b>فائدة لغوية:</b> ﴿اهدنا﴾ فعل أمر لكن المقصود به الالتماس والدعاء لأنه طلب من الأدنى للأعلى.</p><p><b>معلومة:</b> الفاتحة سر القرآن، وسرها ﴿إياك نعبد وإياك نستعين﴾، وألّف ابن القيم «مدارج السالكين بين منازل إياك نعبد وإياك نستعين».</p>"]],
q:[["من أسماء الفاتحة وموضوعاتها (من المقطع المرئي).","من أسمائها: فاتحة الكتاب، أم القرآن، السبع المثاني، الرقية. موضوعاتها: الثناء على الله وتوحيده، الإيمان باليوم الآخر، العبادة والاستعانة، سؤال الهداية."],
["لماذا قدّم الله العبادة على الاستعانة؟","لأن العبادة غاية وحق الله على عبده، والاستعانة وسيلة لتحقيقها؛ وتقديم حق الله على حاجة العبد، وتقديم الغاية على الوسيلة."],
["أناقش وأستنبط: ثلاث فوائد أخرى.","مثلًا: ① الابتداء بالبسملة والحمد ② إثبات يوم الجزاء ③ سؤال الهداية أعظم مطلب."],
["أقدم مشروعًا: لماذا تُكرَّر الفاتحة في كل ركعة؟","لأنها تجمع التوحيد والثناء والدعاء، وتجدد العهد مع الله في كل ركعة، وسؤال الهداية حاجة دائمة، وهي ركن في الصلاة."],
["أتأمل وأجيب: اختر العبادات القلبية الواجب صرفها لله وحده.","كلها لله وحده: الإخلاص – الخشية – الرجاء – التوكل – الإنابة – المحبة – الصبر – اليقين."],
["أقارن بين ﴿الرحمن الرحيم﴾ اتفاقًا واختلافًا.","اتفاق: اسمان لله مشتقان من الرحمة على وجه المبالغة. اختلاف: الرحمن عامة لجميع الخلق، والرحيم خاصة بالمؤمنين."],
["أبحث: مناسبة افتتاح القرآن بالفاتحة عند السيوطي (تناسق الدرر).","ابحث في «تناسق الدرر في تناسب السور» وفي مكتبة رقمية ولخّصها: الفاتحة مجمل لمقاصد القرآن."]]},
{u:"الوحدة الثالثة: سورة يونس",t:"6 – سورة يونس (3 – 10)",s:[
["تمهيد","<p>مكية، آياتها 109، نزلت بعد سورة الإسراء. من أعظم مقاصدها تقرير أصول العقيدة ودفع شبهة المشركين. <b>موضوعاتها:</b> إثبات التوحيد ونبوة محمد ﷺ – إثبات البعث والحشر والجزاء – مواساة النبي بقصص الأنبياء – ذكر اختلاف الناس يوم القيامة – تقرير بعض الأسماء والصفات.</p>"],
["المعنى الإجمالي","<p>الله المستحق للعبادة وحده، خلق السماوات والأرض في ستة أيام، واستوى على العرش، ويدبر الأمر، ولا شفيع إلا بإذنه. إليه مرجع الخلق، وبدأ الخلق ويعيده ليجزي المؤمنين بالقسط، وللكافرين شراب من حميم وعذاب أليم. ثم دلائل قدرته: الشمس ضياءً والقمر نورًا وتقدير منازله لتعلم عدد السنين والحساب، واختلاف الليل والنهار. ثم قسّم الناس: من لا يرجون لقاءه ورضوا بالدنيا فمأواهم النار، والذين آمنوا وعملوا الصالحات يهديهم ربهم بإيمانهم وتجري من تحتهم الأنهار، دعواهم: سبحانك اللهم، وتحيتهم: سلام، وآخر دعواهم: الحمد لله رب العالمين.</p>"],
["معاني الكلمات","<table><tr><th>الكلمة</th><th>معناها</th></tr><tr><td>القسط</td><td>العدل</td></tr><tr><td>حميم</td><td>ماء شديد الحرارة يغلي</td></tr><tr><td>وقدره منازل</td><td>قدّر سير القمر في منازل تختلف كل ليلة</td></tr><tr><td>آخر دعواهم</td><td>خاتمة دعائهم</td></tr></table>"],
["فوائد وأحكام","<ul><li>① إثبات الشفاعة لمن أذن الله، ﴿من ذا الذي يشفع عنده إلا بإذنه﴾ [البقرة:255].</li><li>② الأسماء والصفات: الخلق ﴿خلق السماوات والأرض﴾؛ الاستواء ﴿ثم استوى على العرش﴾؛ المبدئ والمعيد ﴿إنه يبدأ الخلق ثم يعيده﴾؛ المدبّر ﴿يدبر الأمر﴾؛ الرب ﴿ربكم الله﴾؛ العدل ﴿بالقسط﴾؛ الحكمة ﴿يفصل الآيات﴾؛ صدق الوعد ﴿وعد الله حقًا﴾.</li><li>③ الاستواء معلوم، والكيف مجهول، والإيمان به واجب، والسؤال عنه بدعة (الإمام مالك).</li><li>④ دلائل الربوبية: خلق السماوات والأرض في ستة أيام – تدبير الخلائق – جعل الشمس ضياءً والقمر نورًا – اختلاف الليل والنهار.</li><li>⑤ مشروعية تعلم الحساب والفلك لتحقيق المصالح الدينية والدنيوية.</li><li>⑥ خطورة الركون إلى الدنيا والاغترار بها والغفلة عن آيات الله.</li><li>⑦ الهداية نعمة من الله: ﴿يهديهم ربهم بإيمانهم﴾. ⑧ في الجنة ما لا عين رأت ولا أذن سمعت. ⑨ من آداب الدعاء تعظيم الله وتمجيده: ﴿دعواهم فيها سبحانك اللهم﴾.</li><li><b>فائدة لغوية:</b> ﴿يكسبون﴾ بصيغة المضارع للدلالة على استمرارهم في أعمالهم.</li></ul>"]],
q:[["أي موضوعات السورة برز في هذه الآيات؟","إثبات التوحيد واستحقاق الله للعبادة، وإثبات البعث والجزاء، وتقرير الأسماء والصفات."],
["لماذا خصّ الله القمر بتقدير المنازل دون الشمس، وجعل مواسم الإسلام على الحساب القمري؟","لأن منازل القمر ظاهرة للجميع يعرف بها الناس الشهور والسنين بالرؤية، فيسهل ربط العبادات بها، بخلاف الحساب الشمسي."],
["اذكر ثلاثة أدلة على ربوبية الله من الآيات.","خلق السماوات والأرض – تدبير الأمر – تقدير الشمس والقمر والليل والنهار."],
["أستثمر التقنية: ابحث في (آيات) عن ﴿وقدره منازل﴾ وتفسير ابن كثير.","تدريب عملي بالتطبيق؛ يبيّن ابن كثير أن الله قدّر للقمر منازل يسير فيها ليُعرف بها الشهور والسنين."],
["اختر العبادات القلبية الواجب صرفها لله وحده.","كلها لله وحده: الإخلاص، الخشية، الرجاء، التوكل، الإنابة، المحبة، الصبر، اليقين."],
["مشروع: مقال علمي عن السهر (ضوء ﴿جعل لكم الليل لتسكنوا فيه﴾).","قاعدة الصحة: النوم ليلًا والسكون. آثار السهر على: الصحة الجسدية والنفسية والعقلية والرزق."]]},
{u:"الوحدة الثالثة: سورة يونس",t:"7 – سورة يونس (26 – 33)",s:[
["تمهيد","<p>خلق الله ابن آدم وجعل الدنيا ابتلاءً واختبارًا، والمرء على مفترق طرق: إما الصراط المستقيم فيكون من أهل النعيم برحمة الله، وإما غيره فيكون من أصحاب الجحيم بعدل الله.</p>"],
["المعنى الإجمالي","<p>للذين أحسنوا الحسنى (الجنة) وزيادة (النظر إلى وجه الله الكريم)، لا يرهق وجوههم قتر ولا ذلة. والذين كسبوا السيئات فجزاؤهم بمثلها وتغشاهم ذلة وتسودّ وجوههم. ثم يوم القيامة يُحشر المشركون وشركاؤهم، ويتبرأ الشركاء منهم، وتعلم كل نفس ما قدمت. ثم يحتج الله على المشركين بتوحيد الربوبية: من يرزقكم؟ من يملك السمع والأبصار؟ من يخرج الحي من الميت؟ من يدبر الأمر؟ فيقولون: الله، فكيف يصرفون عن الحق؟</p>"],
["معاني الكلمات","<table><tr><th>الكلمة</th><th>معناها</th></tr><tr><td>الحسنى</td><td>الجنة</td></tr><tr><td>زيادة</td><td>النظر إلى وجه الله الكريم</td></tr><tr><td>ولا يرهق وجوههم قتر</td><td>لا ينالهم مكروه ولا تتكدر وجوههم</td></tr><tr><td>فزيلنا بينهم</td><td>فرّقنا بينهم</td></tr><tr><td>تبلو كل نفس ما أسلفت</td><td>تعلم وتختبر ما قدمت من عمل</td></tr><tr><td>فأنّى تصرفون</td><td>فكيف تُصرفون عن الحق</td></tr></table>"],
["فوائد وأحكام","<ul><li>① إثبات رؤية المؤمنين ربهم في الآخرة ﴿وجوه يومئذ ناضرة إلى ربها ناظرة﴾ [القيامة:22-23].</li><li>② الإحسان: أن تعبد الله كأنك تراه؛ ومن كان حاله كذلك كان جزاؤه النظر إليه، بخلاف من تراكمت الذنوب على قلبه فحُجب ﴿كلا إنهم عن ربهم يومئذ لمحجوبون﴾.</li><li>③ من فضل الله مضاعفة الحسنة ومجازاة السيئة بمثلها ﴿من جاء بالحسنة فله عشر أمثالها﴾ [الأنعام:160].</li><li>④ البعث والجزاء: ﴿هنالك تبلو كل نفس ما أسلفت وردوا إلى الله مولاهم الحق﴾.</li><li>⑤ لا ينفع مجرد التصديق بوجود الله إلا مع العمل الصالح، وصرف العبادة له وحده؛ وأعظم ما يُعصى الله به الشرك، وتقرير ذلك في ﴿فقل أفلا تتقون﴾ ﴿فماذا بعد الحق إلا الضلال﴾.</li></ul><p><b>معلومة:</b> العقل نعمة يجب إعماله في معرفة الله والتفكر، ويجب حفظه عما يفسده كالمسكرات والمخدرات والمذاهب الضالة.</p>"]],
q:[["أستهل: ما أبرز صفة تقررها الآيات؟","الربوبية: تفرد الله بالرزق والخلق والتدبير؛ وكذلك العدل في الجزاء."],
["أفكر: لماذا جاء تقرير هذه المسائل العقدية بصيغة السؤال والجواب؟","لأن إقرار المشركين بالجواب (الله) حجة عليهم تلزمهم بتوحيد الألوهية، ولأنها أبلغ في الإقناع."],
["أربط: ﴿كلا سيكفرون بعبادتهم﴾ [مريم:82] و﴿يوم تبلى السرائر﴾ [الطارق:9].","الأولى ← ﴿ويوم نحشرهم جميعًا ثم نقول للذين أشركوا مكانكم﴾ (تبرؤ الشركاء). الثانية ← ﴿هنالك تبلو كل نفس ما أسلفت﴾."],
["أستثمر التقنية: ﴿ومن يخرج الحي من الميت﴾ في تفسير السعدي.","تدريب بالتطبيق: يبيّن السعدي أن إخراج الحي من الميت ونحوه دليل على قدرة الله وربوبيته."],
["أستنبط: أين تجد مبدأ «المسؤولية» وأن بعضهم يتخلى عند الشدائد؟","﴿وقال شركاؤهم ما كنتم إيانا تعبدون﴾، فالشركاء تخلوا عنهم يوم القيامة."],
["أبحث: لماذا كنّى الله بالوجه عن الجسد في ﴿ولا يرهق وجوههم قتر ولا ذلة﴾؟","لأن الوجه أشرف الأعضاء وتظهر عليه آثار الفرح والحزن، فإذا ظهر عليه الأثر دل على حال صاحبه كله."]]},
{u:"الوحدة الثالثة: سورة يونس",t:"8 – سورة يونس (62 – 70)",s:[
["المعنى الإجمالي","<p>ينفي الله عن أوليائه الخوف والحزن، وهم الذين جمعوا بين الإيمان والتقوى، ولهم البشرى في الحياة الدنيا وفي الآخرة، وهو الفوز العظيم. ثم يخاطب نبيه: لا يحزنك قولهم، فإن العزة لله جميعًا. وله من في السماوات والأرض، وما يتبع المشركون إلا الظن. ثم يذكر نعمه: جعل الليل للسكون والنهار مبصرًا. ثم يردّ على من زعم أن لله ولدًا: هو الغني، ولا برهان لهم. ثم يبين أن الذين يفترون على الله الكذب لا يفلحون، متاع في الدنيا ثم إليه مرجعهم وعذاب شديد.</p>"],
["معاني الكلمات","<table><tr><th>الكلمة</th><th>معناها</th></tr><tr><td>كلمات الله</td><td>وعده ووعيده وأحكامه وأقواله</td></tr><tr><td>يخرصون</td><td>يكذبون ويقولون بالظن</td></tr><tr><td>والنهار مبصرا</td><td>مضيئًا يُبصر فيه الناس ويقضون حوائجهم</td></tr><tr><td>إن عندكم من سلطان بهذا</td><td>ليس لديكم حجة ولا برهان</td></tr></table>"],
["فوائد وأحكام","<ul><li>① إكرام الله أولياءه بتعجيل البشارة لهم في الدنيا، كما في «تلك عاجل بشرى المؤمن» (مسلم 2642) والرؤيا الصالحة (البخاري 6990).</li><li>② أولياء الله هم الجامعون بين: <b>الإيمان</b> و<b>التقوى</b>.</li><li>③ من أعظم ما يدفع الخوف: تعلق القلب بالله وصدق اللجوء إليه، وأن مقاليد الأمور بيده (حديث ابن عباس، الترمذي 2516).</li><li>④ ضلال من زعم أن لله ولدًا؛ فالله الواحد الأحد.</li><li>⑤ الله يمهل ولا يهمل، «إن الله ليملي للظالم حتى إذا أخذه لم يفلته»؛ ويظهر في ﴿متاع في الدنيا ثم إلينا مرجعهم﴾.</li></ul><p><b>دلالة قرآنية:</b> سمّى الله الحجة العلمية «سلطانًا» لأنها توجب تسلط صاحبها واقتداره، فإقناع الآخر يكون بالحجة والحكمة والبرهان لا بالتهديد والقوة.</p>"]],
q:[["أستهل: ما الشعور الذي تنفيه الآية الأولى وتثبته الأخيرة؟ وما سبب الاختلاف؟","تنفي الخوف والحزن عن الأولياء، وتثبت العذاب للمفترين؛ سبب الاختلاف: الإيمان والتقوى عند الأولياء مقابل الكفر والافتراء عند غيرهم."],
["أستنبط البشارة: التوبة 21-22 – فصلت 30-32 – الحديد 12.","التوبة: رحمة من الله ورضوان وجنات. فصلت: تتنزل عليهم الملائكة ألا تخافوا ولا تحزنوا وأبشروا بالجنة. الحديد: نورهم يسعى بين أيديهم وبشراهم جنات."],
